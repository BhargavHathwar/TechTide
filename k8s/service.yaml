apiVersion: v1
kind: Service
metadata:
  name: techtide-service
  namespace: techtide
  labels:
    app.kubernetes.io/name: techtide
spec:
  # Type LoadBalancer automatically provisions an Azure Public IP in AKS
  type: LoadBalancer
  selector:
    app: techtide
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000

