apiVersion: v1
kind: Secret
metadata:
  name: techtide-secret
  namespace: techtide
  labels:
    app.kubernetes.io/name: techtide
type: Opaque
stringData:
  # Copy this file to k8s/secret.yaml and replace with a strong random secret
  # Generate with: openssl rand -base64 32
  JWT_SECRET: "replace-with-a-secure-random-jwt-secret-key"
